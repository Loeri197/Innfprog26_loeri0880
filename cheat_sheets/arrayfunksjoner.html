<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheatsheet for arrayfunksjoner</title>
</head>
<body>
    <h1>Arrayfunksjoner</h1>
    <p> Vi finner antall i en array ved å bruke .lenght: <span id="arrayCount"></span></p>
    <h2> To måter å skrive ut en Array på:</h2>
    <p>toString(): <span id="toString"></span></p>
    <p>.join():<span id ="join"></span></p>

    <h2> Array etter slettemetoder er kjørt</h2>
    <p id="deleted"></p>

    <script>
        const books = [ 
        "Silver Eyes",
        "Harry Potter og de vises sten",
        "Fourth Wing",
        "Bibelen",
        "Nålen",
        "Jævla drittsystem",
        "Dont make me think",
        "Twisted ones",
        "Hunger games",
        "Surrounded by idiots"

        ]
        
        document.getElementById("arrayCount").innerHtml = books.length

        //LEGGE TIL ELEMENTER I ARRAYEN:
        //.push(element): Legger inn element på slutten av arrayen
        books.push("LOTR: Fellowship of the Ring")
        //.unshift(element): Legger inn element i starten av arrayen, og forskyver indexer!
        books.unshift("LOTR: Two towers")
        //.splice(startindex, number of elements modified, element(s)):
        //startindex: hvilken index vi starter å manipulere arrayen på
        //number of element modified: Hvis vi skal slette elementer, hvor mange fra og med Startindex
        //(eksempel:Hvis startindex er 2, og antall elementer er 2, slettes index 2 og 3) Når vi legger til elementer, skal number of elements modified alltid være 0

        books.splice(5, 0, "LOTR: Return of the King")

        
        //.toString(): skriver ut en kommaseparert liste av en array
        document.getElementById("toString").innerHTML = books.toString()
        //.join(param): join skrive ut alle elementene i en array, separert av param
        document.getElementById("join").innerHTML = books.join(", ")

        //FJERNE ELEMENTER I ARRAYEN:
        //.pop(): Sletter det siste elementet i arrayen
        books.pop()
        //.shift(): sletter det første elementet i arrayen
        books.shift()
        //.splice(startindex, number of elements to delete)

        books.splice (4, 1 )

        document.getElementById("deleted").innerHTML = books.join (", ")





    </script>

</body>
</html>

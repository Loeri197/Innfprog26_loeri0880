<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passord Generator</title>
</head>
<body>
    <main>
        <h2> Passord Generator</h2>
        <button id="generer">Generer passord</button>
        <p id="passordutskrift"></p>
    </main>
    
    

 <script>
     document.getElementById("generer").addEventListener("click", function(event) {
        document.getElementById("passordutskrift").innerHTML = "Knappen er trykket"
     })
    
        

 </script>   
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions, oppgave 1</title>
</head>
<body>
    <p></p>
    <script>
         const people = ["Marius", "Tore", "Susanne", "Monica", "Arne", "Zoltan", "Beate"]

        function sortArray(array) {
            //Sortere arrayen alfabetisk
            array.sort()
            //Lage en ny p-tag
            const ptag = document.createElement("p")
            //Fylle ptag med array, kommaseparert
            ptag.innerHTML = array.join(", ")
            //Skrive ut p-tag til nettside
            document.body.appendChild(ptag)
            //Testutskrift
            console.log(ptag)
        }

        sortArray(people)

        function printNames(array) {
              //Sortere array
            array.sort()
            //Lage et ul-element
            const ul = document.createElement("ul")

            printNames(people)
          


        
            //Fylle ultag med li-elementer med navn
            array.map(person => {
                //Lage en <li> (listeelement)
                        const li = document.createElement("li")
                    //Få navnet i "person"-paramenteren inn i <li>
                        li.innerHTML= person
                    //Legge <li>-elementet inn i <ul>
                        ul.appendChild(li)
                    
                })
            console.log(ul)
            //Legge <ul>-listen på nettsiden:
                document.body.appendChild(ul)
        }


    </script>


</body>
</html>

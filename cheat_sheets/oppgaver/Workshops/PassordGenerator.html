<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 1 Passord Generator</title>
</head>
<body>
    <main>
        <h2> Passord Generator</h2>
        <p>
            <label for="lengde">Hvor langt skal passordet være?</label>
            <input type = "number" id="lengde" name="lengde" value="8" />
        </p>
        <button id="generer">Generer passord</button>
        <p id="passordutskrift"></p>
    </main>
    
    

 <script>
    //REGLER OG KONFIGURASJON
    let passord = ""
    const tillatteTegn = "abcdefghijklmnopqrstuvwxyzæøåABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ0123456789"


        document.getElementById("generer").addEventListener("click", function (event) {
        //Tøm passord-variabel for å gjøre klar til nytt passord:
        passord = ""
        //Hente ut hvor langt passordet skal være: 
            const passordLengde = document.getElementById("lengde").value
        //GENERER ETT PASSORD
        for(teller = 0; teller < passordLengde; teller++) { 
            const tilfeldigTegn = Math.floor(Math.random() * tillatteTegn.length)
            console.log(tilfeldigTegn,tillatteTegn[tilfeldigTegn])
            passord += tillatteTegn[tilfeldigTegn]

        }

        document.getElementById("passordutskrift").innerHTML = passord 
     })
     
    
        

 </script>   
</body>
</html>
